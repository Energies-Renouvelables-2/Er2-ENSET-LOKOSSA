<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ER2 ENSET Lokossa – Cours en ligne</title>
<style>
:root { --bleu:#0b3d91; --bleu-vif:#1e6bff; --texte:#0f172a; --rouge:#b91c1c; --vert:#15803d; }
* { box-sizing: border-box; }
body {
  margin:0;
  min-height:100vh;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color:var(--texte);
  background: radial-gradient(900px 500px at 15% 10%, #1e5bd6 0%, transparent 60%),
              linear-gradient(160deg, #071e4a, #0b3d91 60%, #0a2f70);
  background-color:#0a2f70;
}
header { color:#fff; padding:28px 16px 8px; text-align:center; }
header svg { width:88px; height:88px; }
header h1 { margin:8px 0 4px; font-size:1.6rem; }
header p { margin:0; opacity:.85; }
main { max-width:560px; margin:24px auto; padding:0 16px 40px; }
.carte { background:#fff; border-radius:16px; padding:26px; box-shadow:0 24px 50px -20px #00000066; }
h2 { margin:0 0 6px; font-size:1.3rem; color:#0b2a63; }
label { display:block; font-weight:600; margin:14px 0 6px; }
input { width:100%; padding:12px; border:1.5px solid #cbd5e1; border-radius:10px; font-size:1rem; background:#f7f9fd; }
input:focus { outline:none; border-color:var(--bleu-vif); background:#fff; box-shadow:0 0 0 4px #1e6bff22; }
button { color:#fff; border:0; border-radius:10px; padding:13px 16px; font-size:1rem; cursor:pointer; width:100%; margin-top:14px; background:linear-gradient(135deg, var(--bleu), var(--bleu-vif)); box-shadow:0 8px 20px #0b3d9155; }
button:disabled { opacity:.6; cursor:wait; }
button.secondaire { background:#e4e9f3; color:var(--texte); box-shadow:none; }
button:focus-visible { outline:3px solid #9cc0ff; outline-offset:2px; }
.statut { font-size:.9rem; margin:12px 0 0; color:#475569; }
.ok { color:var(--vert); }
.erreur { color:var(--rouge); }
</style>
</head>
<body>

<header>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="48" fill="#ffffff"/>
    <path d="M14 98 Q18 60 50 56 Q82 60 86 98 Z" fill="#0f172a"/>
    <path d="M42 58 L50 98 L58 58 Z" fill="#f59e0b"/>
    <circle cx="50" cy="42" r="15" fill="#fcd9b4"/>
    <circle cx="44" cy="43" r="1.8" fill="#1e293b"/>
    <circle cx="56" cy="43" r="1.8" fill="#1e293b"/>
    <path d="M44 50 Q50 55 56 50" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M34 34 Q50 42 66 34 L66 41 Q50 49 34 41 Z" fill="#0f172a"/>
    <polygon points="50,18 84,28 50,38 16,28" fill="#1e293b"/>
    <line x1="78" y1="31" x2="78" y2="48" stroke="#f59e0b" stroke-width="2"/>
    <rect x="75" y="46" width="6" height="8" fill="#f59e0b" rx="1"/>
  </svg>
  <h1>ER2 ENSET Lokossa</h1>
  <p>Cours en ligne</p>
</header>

<main>
  <section class="carte">
    <h2>Inscription au cours</h2>
    <form id="form-inscription">
      <label for="nom">Nom</label>
      <input id="nom" required autocomplete="family-name">

      <label for="prenom">Prénom</label>
      <input id="prenom" required autocomplete="given-name">

      <label for="matricule">Matricule</label>
      <input id="matricule" required pattern="[A-Za-z0-9/\-]{3,30}" title="Entre 3 et 30 caractères : lettres, chiffres, tirets ou barres obliques" placeholder="ex. ENSET-2025-001" autocomplete="off">
      <p class="statut" id="msg-mat" aria-live="polite"></p>

      <label for="telephone">Numéro de téléphone</label>
      <input id="telephone" type="tel" required pattern="[+0-9 ]{8,20}" title="Entre 8 et 20 chiffres, avec ou sans +" autocomplete="tel" placeholder="ex. +229 97 00 00 00">

      <p class="statut" id="statut-loc">Localisation : en attente…</p>
      <button type="button" class="secondaire" id="btn-loc">Autoriser ma localisation</button>

      <button type="submit" id="btn-valider">Valider et rejoindre la réunion</button>
    </form>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== CONFIGURATION ===== */
const CONFIG = {
  MEET_URL: "https://meet.google.com/jsa-xtup-zos",       // ← votre lien Google Meet
  SUPABASE_URL: "https://idvdperqrokcxogroebo.supabase.co",       // ← Settings > API > Project URL
  SUPABASE_KEY: "sb_publishable_hpkv1RTNO6RQ69pSbU9X5g_heLvbBNM"                 // ← Settings > API > anon public key
};

const db = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const $ = id => document.getElementById(id);
const BOUTON_TEXTE = "Valider et rejoindre la réunion";
let position = null;

/* ===== LOCALISATION ===== */
function demanderLocalisation() {
  const s = $("statut-loc");
  if (!navigator.geolocation) {
    s.textContent = "Localisation : non disponible sur ce navigateur.";
    s.className = "statut erreur";
    return;
  }
  s.textContent = "Localisation : demande d’autorisation…";
  s.className = "statut";
  navigator.geolocation.getCurrentPosition(
    p => {
      position = { latitude: p.coords.latitude, longitude: p.coords.longitude, precision: Math.round(p.coords.accuracy) };
      s.textContent = "Localisation enregistrée (précision d’environ " + position.precision + " m).";
      s.className = "statut ok";
    },
    () => {
      position = null;
      s.textContent = "Localisation non autorisée. Vous pouvez tout de même vous inscrire.";
      s.className = "statut erreur";
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
}

/* ===== INSCRIPTION ===== */
$("form-inscription").addEventListener("submit", async e => {
  e.preventDefault();
  const champs = ["nom", "prenom", "matricule", "telephone"].map($);
  const invalide = champs.find(c => !c.checkValidity());
  if (invalide) {
    invalide.reportValidity();
    return;
  }

  const msg = $("msg-mat");
  msg.textContent = "";
  msg.className = "statut";
  const btn = $("btn-valider");
  btn.disabled = true;
  btn.textContent = "Enregistrement…";

  // La fonction crée l'inscription, ou met à jour celle qui existe déjà pour ce matricule
  const { data: ok, error } = await db.rpc("inscrire", {
    p_nom: $("nom").value.trim(),
    p_prenom: $("prenom").value.trim(),
    p_matricule: $("matricule").value.trim().toUpperCase(),
    p_telephone: $("telephone").value.trim(),
    p_latitude: position ? position.latitude : null,
    p_longitude: position ? position.longitude : null,
    p_precision: position ? position.precision : null
  });

  if (error) {
    console.error(error);
    alert("Impossible d’enregistrer votre inscription. Vérifiez votre connexion et réessayez.");
    btn.disabled = false;
    btn.textContent = BOUTON_TEXTE;
    return;
  }

  if (!ok) {
    msg.textContent = "Ce matricule ne figure pas dans la liste de la classe. Vérifiez-le ou contactez l’administrateur.";
    msg.className = "statut erreur";
    $("matricule").focus();
    btn.disabled = false;
    btn.textContent = BOUTON_TEXTE;
    return;
  }

  window.location.href = CONFIG.MEET_URL;
});

$("btn-loc").addEventListener("click", demanderLocalisation);
window.addEventListener("load", demanderLocalisation);
</script>
</body>
</html>
